/* 動態設備資訊由 JS 寫入 html[data-device]。CSS 仍以 viewport 為主，JS 只負責裝置能力與細節。 */
html[data-device="phone"] .content{padding:14px 12px;}
html[data-device="phone"] .card{border-radius:18px;padding:15px;margin-bottom:12px;}
html[data-device="phone"] .top{padding:15px 14px 12px;}
html[data-device="phone"] .title{font-size:clamp(22px,6.4vw,26px);line-height:1.2;}
html[data-device="phone"] .sub{font-size:clamp(13px,3.7vw,15px);line-height:1.45;}
html[data-device="phone"] h2{font-size:clamp(20px,5.6vw,22px);line-height:1.3;}
html[data-device="phone"] h3{font-size:clamp(17px,4.8vw,19px);line-height:1.35;}
html[data-device="phone"] .muted,
html[data-device="phone"] .section-meta,
html[data-device="phone"] .block-count,
html[data-device="phone"] .update-time{font-size:clamp(13px,3.6vw,15px);line-height:1.45;}
html[data-device="phone"] .empty-mini,
html[data-device="phone"] .section-empty{font-size:14px !important;line-height:1.55 !important;}
html[data-device="phone"] .btn{min-height:44px;padding:10px 14px;white-space:nowrap;}
html[data-device="phone"] .mini-btn{min-height:40px;padding:8px 10px;}

/* 五大頭條：手機固定成清楚的 2 欄控制區，不讓標題／按鈕互搶寬度。 */
.highlight-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-width:0;}
.highlight-heading{min-width:0;flex:1 1 auto;}
.highlight-toolbar{display:flex;gap:8px;flex-wrap:wrap;flex:0 0 auto;min-width:0;}
.highlight-toolbar .btn{flex:0 0 auto;}
.highlight-history-toolbar{margin-top:10px;}
html[data-device="phone"] .highlight-head{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;}
html[data-device="phone-compact"] .highlight-head{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;}
html[data-device="phone"] .highlight-toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;}
html[data-device="phone"] .highlight-toolbar .btn{width:100%;min-width:0;}
html[data-device="phone"] .highlight-history-toolbar{display:block;width:100%;}
html[data-device="phone"] .highlight-history-toolbar .btn{width:100%;}

/* 所有主要表單列在窄螢幕都以單欄為基準。 */
html[data-device="phone"] .row{flex-wrap:wrap;align-items:flex-start;}
html[data-device="phone"] .row > div:first-child{min-width:0;flex:1 1 220px;}
html[data-device="phone"] .searchbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;}
html[data-device="phone"] .searchbar input{min-width:0;width:100%;}
html[data-device="phone"] .searchbar .btn{width:auto;}
html[data-device="phone"] .navs{grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding-left:8px;padding-right:8px;}
html[data-device="phone"] .nav{min-width:0;padding-left:4px;padding-right:4px;}

/* 小型手機再縮一點間距，避免任何橫向擠壓。 */
html[data-device="phone-compact"] .content{padding-left:10px;padding-right:10px;}
html[data-device="phone-compact"] .card{padding:13px;border-radius:16px;}
html[data-device="phone-compact"] .nav{font-size:11px;}

/* 平板：保留卡片式版面，但控制寬度與間距。 */
html[data-device="tablet"] .content{padding:18px 18px;}
html[data-device="tablet"] .card{padding:17px;}

/* 觸控裝置：避免文字按鈕被瀏覽器壓縮成小點擊區。 */
html[data-input="touch"] button,
html[data-input="touch"] a.btn,
html[data-input="touch"] .mini-btn{touch-action:manipulation;}

/* 關閉動態效果時保持乾淨、穩定。 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto !important;transition:none !important;}
}

function safeLocalJSON(key,fallback){
  try{
    const raw=localStorage.getItem(key);
    if(raw===null||raw==="")return fallback;
    const parsed=JSON.parse(raw);
    return parsed==null?fallback:parsed;
  }catch(_){return fallback;}
}

const translationCache=(()=>{
  try{
    const raw=JSON.parse(localStorage.getItem("sd_translation_cache")||"{}");
    const now=Date.now();
    const out={};
    for(const [k,v] of Object.entries(raw||{})){
      if(v && typeof v==="object" && v.value && now-(v.time||0)<7*24*60*60*1000) out[k]=v;
    }
    return out;
  }catch(_){return {};}
})();
let translationRunId=0;

function titleNeedsTranslation(text){
  const s=String(text||"").trim();
  if(!s)return false;
  if(/[\uac00-\ud7af]/.test(s) || /[\u3040-\u30ff]/.test(s))return true;
  const han=(s.match(/[\u3400-\u9fff]/g)||[]).length;
  const latin=(s.match(/[A-Za-z]/g)||[]).length;
  if(han>=3 && han>=Math.ceil((han+latin)*0.45))return false;
  return latin>=2;
}

function saveTranslationCache(){
  try{
    const entries=Object.entries(translationCache).slice(-400);
    localStorage.setItem("sd_translation_cache",JSON.stringify(Object.fromEntries(entries)));
  }catch(_){}
}

function normalizeSection(s){
  const legacyTypes=Array.isArray(s.types)?s.types:["全部"];
  return {
    id:s.id||crypto.randomUUID(),
    name:s.name||"未命名日報",
    sport:s.sport||"棒球",
    league:s.league||"全部",
    contentTypes:Array.isArray(s.contentTypes)?s.contentTypes:legacyTypes,
    hours:Number(s.hours)||24,
    keywords:Array.isArray(s.keywords)?s.keywords.map(x=>String(x).trim()).filter(Boolean).slice(0,20):[]
  };
}

function matchesType(n,type){
  const title=String(n?.title||"");
  const meta=String(n?.eventType||"");
  const metas=Array.isArray(n?.eventTypes)?n.eventTypes.map(String):[];
  if(meta===type || metas.includes(type))return true;
  const rule=TYPE_RULES[type];
  if(!rule)return false;
  if(!rule.test(title))return false;

  // 降低泛用詞造成的誤判。
  if(type==="比賽結果" && !/(?:score|won\s+\d|lost\s+\d|defeated|beats?|victory|勝\d|敗\d|擊敗|戰勝|比數|比分|賽果|終場|完賽)/i.test(title))return false;
  if(type==="球員／選手表現" && !/(?:stats?|statistics|points?|rebounds?|assists?|hits?|home runs?|strikeouts?|安打|全壘打|三振|得分|籃板|助攻|成績|表現|player performance)/i.test(title))return false;
  if(type==="獎項／MVP" && !/(?:MVP|most valuable|award|player of the week|player of the month|獎項|最佳球員|年度獎)/i.test(title))return false;
  if(type==="簽約／續約" && !/(?:signed|signing|extension|contract|new deal|簽約|簽下|續約|合約)/i.test(title))return false;
  if(type==="受傷" && /(?:injury update|injury status|injury report|傷勢更新|傷情更新)/i.test(title))return false;
  if(type==="復出" && !/(?:comeback|returns? to action|returning to play|back in lineup|復出|回歸|歸隊)/i.test(title))return false;
  if(type==="其他重要新聞")return false;
  return true;
}

function classify(n,preferred=[]){
  const pref=Array.isArray(preferred)?preferred.filter(x=>x&&x!=="全部"):[];
  if(n?.eventType && TYPE_RULES[n.eventType] && matchesType(n,n.eventType)) return n.eventType;

  // 有選取類型時，只從選取類型中挑最符合者。
  const candidates=pref.length?pref:TYPES.filter(x=>x!=="全部");
  let best="其他重要新聞",bestScore=0;
  for(const type of candidates){
    if(!matchesType(n,type))continue;
    let score=10;
    if(n?.eventType===type)score+=30;
    if(String(n?.title||"").match(TYPE_RULES[type]))score+=8;
    if(pref.includes(type))score+=20;
    if(score>bestScore){bestScore=score;best=type;}
  }
  return best;
}

function languageLabel(n){
  const v=String(n.language||"").toLowerCase();
  if(v.includes("zh"))return "繁中";
  if(v.includes("ja")||v.includes("日本"))return "日本語";
  if(v.includes("ko")||v.includes("韓"))return "한국어";
  if(v.includes("es"))return "Español";
  if(v.includes("fr"))return "Français";
  if(v.includes("de"))return "Deutsch";
  if(v.includes("it"))return "Italiano";
  return "English";
}

function hardLeagueFilter(n,s){
  const requested=s.league||"全部";
  if(requested==="全部")return true;

  // 後端若已完成分區標記，直接信任該分區結果。
  // 不再因標題裡出現其他聯盟／同名球隊而誤殺新聞。
  if(n.sectionId && String(n.sectionId)===String(s.id))return true;
  if(n.league && String(n.league)===String(requested))return true;

  // 若後端缺少聯盟欄位，才使用文字作為最後一道保護。
  const text=String(`${n.title||""} ${n.sourceName||""} ${n.url||""}`).toLowerCase();
  if(s.sport==="棒球" && BASEBALL_LEAGUE_TERMS[requested]){
    const ownLeague=(BASEBALL_LEAGUE_TERMS[requested]||[]).map(x=>x.toLowerCase());
    const ownTeam=(BASEBALL_TEAM_TERMS[requested]||[]).map(x=>x.toLowerCase());
    return [...ownLeague,...ownTeam].some(x=>text.includes(x));
  }

  const aliases=(LEAGUES[s.sport]||[]).find(x=>x===requested);
  const direct=[requested].concat(
    requested==="世界盃"?["FIFA World Cup","World Cup"]:
    requested==="歐冠"?["UEFA Champions League","Champions League"]:
    requested==="英超"?["Premier League"]:
    requested==="西甲"?["La Liga"]:
    requested==="意甲"?["Serie A"]:
    requested==="德甲"?["Bundesliga"]:
    requested==="法甲"?["Ligue 1"]:
    requested==="四大滿貫"?["Grand Slam","Wimbledon","US Open","French Open","Australian Open"]:
    requested==="F1"?["Formula 1","FIA Formula One"]:
    requested==="NBA"?["National Basketball Association"]:
    requested==="NFL"?["National Football League"]:
    requested==="UFC"?["Ultimate Fighting Championship"]:
    requested==="NHL"?["National Hockey League"]:
    requested==="PGA"?["PGA Tour"]:
    requested==="LPGA"?["LPGA Tour"]:
    []
  );
  return direct.some(x=>text.includes(String(x).toLowerCase())) || text.includes(String(aliases||"").toLowerCase());
}

function scoreArticle(n,s){
  const cats=[classify(n)];
  const preferred=(s.contentTypes||[]).filter(x=>x!=="全部");
  let score=0;

  if(s.league && s.league!=="全部")score+=100;
  for(let i=0;i<preferred.length;i++){
    if(cats.includes(preferred[i]))score+=35-i;
  }

  const t=Date.parse(n.publishedAt||"");
  if(Number.isFinite(t))score+=Math.max(0,10-(Date.now()-t)/3600000);

  return score;
}

function newsQualityScore(n,s){
  const title=String(n.title||'').trim();
  const lower=title.toLowerCase();
  const preferred=(s.contentTypes||[]).filter(x=>x!=="全部");
  const ts=Date.parse(n.publishedAt||'');
  const age=Number.isFinite(ts)?Math.max(0,(Date.now()-ts)/3600000):168;
  const sources=Math.max(1,Number(n.sourceCount||1));
  const titleWords=title.split(/\s+/).filter(Boolean).length;
  let score=0;

  // 基本資訊量：太短、過度泛化的標題降低優先級。
  score += Math.min(24, titleWords*3);
  score += Math.min(24, sources*8);
  score += Math.max(0, 18-age*0.55);

  if(preferred.length && preferred.includes(classify(n,preferred))) score += 18;

  // 明確事件型新聞優先。
  if(/(?:交易|簽約|續約|受傷|手術|復出|缺席|禁賽|罰款|教練|冠軍|決賽|晉級|淘汰|紀錄|MVP|record|trade|signed|injury|surgery|return|suspended|champion|final|playoff|milestone)/i.test(title)) score += 14;

  // 降低純導讀、泛盤點、預測、非事件型內容。
  if(/(?:daily|weekly|roundup|recap|preview|power ranking|what to know|everything you need|best of|top stories|news roundup|熱身|懶人包|盤點|整理|前瞻|預測|觀察|專題)/i.test(title)) score -= 12;
  if(title.length < 12) score -= 10;

  // 來源多元通常比單一來源更值得放前面。
  if(Array.isArray(n.languages) && n.languages.length>=2) score += 8;

  return score;
}

function displayPoolForSection(s){
  const ranked=rankedForSection(s);
  if(!ranked.length)return [];
  const scored=ranked.map(n=>({...n,_quality:newsQualityScore(n,s)}));
  const strong=scored.filter(n=>n._quality>=28);
  // 保持「擴大搜尋」，但只把高資訊量新聞放進主要版面；若資料不足則自動放寬。
  const pool=(strong.length>=6?strong:scored).sort((a,b)=>
    b._quality-a._quality || Number(b.heatScore||0)-Number(a.heatScore||0)
  );
  return pool.slice(0,36);
}

function rankedForSection(s){

  const source=Array.isArray(newsBySection[s.id])
    ?newsBySection[s.id]
    :[];

  const filtered=source.filter(n=>hardLeagueFilter(n,s));

  const scored=filtered.map(n=>{
    const ts=Date.parse(n.publishedAt||"");
    const age=Number.isFinite(ts)
      ?Math.max(0,(Date.now()-ts)/3600000)
      :168;

    const backendHeat=Number(n.heat);
    const fallbackHeat=
      Math.max(0,100-age*2.5)+
      Math.min(20,Math.max(0,Number(n.sourceCount||1)-1)*10)+
      Math.min(10,Math.max(0,(Array.isArray(n.languages)?n.languages.length:1)-1)*5);

    return {...n,_rawHeat:Number.isFinite(backendHeat)?backendHeat:fallbackHeat,heatScore:Number.isFinite(backendHeat)?backendHeat:fallbackHeat};
  });

  const raws=scored.map(n=>n._rawHeat);
  const min=Math.min(...raws,0);
  const max=Math.max(...raws,1);

  return scored
    .map(n=>({
      ...n,
      heatScore:
        Number.isFinite(Number(n.heat))
          ?Math.max(0,Math.min(100,Math.round(Number(n.heat))))
          :(max===min
            ?Math.round(Math.min(100,n._rawHeat))
            :Math.round(25+75*(n._rawHeat-min)/(max-min)))
    }))
    .sort((a,b)=>
      b.heatScore-a.heatScore
      ||
      scoreArticle(b,s)-scoreArticle(a,s)
      ||
      Date.parse(b.publishedAt||"")-Date.parse(a.publishedAt||"")
    );
}

function groupSection(s){

  const ranked=displayPoolForSection(s).filter(filteredNews);
  const selected=(s.contentTypes||["全部"]).filter(x=>x!=="全部");

  // 有勾選內容類型時，這裡採用「嚴格符合」：
  // 重要新聞、分類區塊、其他新聞都只能從使用者選的類型中產生。
  const strictPool = selected.length
    ? ranked.filter(n=>selected.some(type=>matchesType(n,type)))
    : ranked;

  const important=strictPool
    .filter(n=>Number(n.heatScore??0)>=60)
    .slice(0,5);

  const importantBlock=`
    <div class="report-block important-box">

      <div class="block-head">
        <div class="block-title">🔥 重要新聞</div>
        <div class="block-count">
          ${important.length} 則
        </div>
      </div>

      ${
        important.map(articleHtml).join("")
        ||
        '<div class="empty-mini">目前沒有達到本聯盟重要門檻的符合條件新聞</div>'
      }

    </div>
  `;

  if(!selected.length){

    const rest=ranked.filter(n=>!important.includes(n));

    return importantBlock+`
    <div class="report-block">

      <div class="block-head">
        <div class="block-title">📰 其他相關新聞</div>
        <div class="block-count">${rest.length} 則</div>
      </div>

      ${
        rest.slice(0,8).map(articleHtml).join("")
        ||
        '<div class="empty-mini">目前沒有其他相關新聞</div>'
      }

    </div>
    `;
  }

  const used=new Set(important);
  const blocks=[];

  for(const type of selected){

    const arr=strictPool.filter(
      n=>matchesType(n,type) && !used.has(n)
    );

    const limited=arr.slice(0,4);
    limited.forEach(n=>used.add(n));

    blocks.push(`
      <div class="report-block">

        <div class="block-head">
          <div class="block-title">${esc(type)}</div>
          <div class="block-count">${limited.length} 則</div>
        </div>

        ${
          limited.map(articleHtml).join("")
          ||
          '<div class="empty-mini">目前沒有符合此類型的新聞</div>'
        }

      </div>
    `);
  }

  // 僅顯示「有選取類型、但未被前面區塊使用」的新聞。
  const other=strictPool.filter(n=>!used.has(n));

  blocks.unshift(importantBlock);

  blocks.push(`
    <div class="report-block">

      <div class="block-head">
        <div class="block-title">📰 其他符合條件新聞</div>
        <div class="block-count">${Math.min(other.length,8)} 則</div>
      </div>

      ${
        other.slice(0,8).map(articleHtml).join("")
        ||
        '<div class="empty-mini">目前沒有其他符合所選內容類型的新聞</div>'
      }

    </div>
  `);

  return blocks.join("");
}

function allArticles(){
  const seen=new Set();
  const out=[];
  sections.forEach(s=>{
    const safe=normalizeSection(s);
    (newsBySection[safe.id]||[]).forEach(n=>{
      const key=String(n.url||n.title||"").toLowerCase();
      if(!key||seen.has(key))return;
      seen.add(key);
      out.push({...n,_section:safe});
    });
  });
  return out;
}
function focusArticles(){
  return allArticles().filter(n=>{
    const selected=(n._section.contentTypes||[]).filter(x=>x!=="全部");
    return !selected.length || selected.includes(classify(n,selected));
  }).sort((a,b)=>{
    const pa=(a._section.contentTypes||[]).filter(x=>x!=="全部");
    const pb=(b._section.contentTypes||[]).filter(x=>x!=="全部");
    const sa=(a.eventType&&pa.includes(a.eventType)?40:0)+(a.league&&a._section.league===a.league?30:0);
    const sb=(b.eventType&&pb.includes(b.eventType)?40:0)+(b.league&&b._section.league===b.league?30:0);
    return (sb-sa)||(Date.parse(b.publishedAt||"")-Date.parse(a.publishedAt||""));
  }).slice(0,5);
}
function focusHtml(){
  const arr=focusArticles();
  if(!arr.length)return "";
  return `<div class="card"><div class="row"><div><h2>🔥 今日焦點</h2><div class="muted">依你的日報設定，優先整理最重要的幾則</div></div></div><div class="focus-list">${arr.map(n=>{const t=String(n.title||"");const zh=!titleNeedsTranslation(t);return `<div class="focus-item"><div class="focus-title ${translateTitles&&!zh?"title-translate":""}" ${translateTitles&&!zh?`data-original-title="${esc(t)}"`:""}>${translateTitles&&!zh?"翻譯中…":esc(t)}</div>${translateTitles&&!zh?`<div class="title-original">原文：${esc(t)}</div>`:""}<div class="focus-meta"><span>${esc(n.sourceName||"新聞來源")}</span><span>${esc(languageLabel(n))}</span><span>${esc(n._section.sport)} · ${esc(n._section.league)}</span></div><div style="margin-top:5px"><span class="focus-tag">${esc(n.eventType||"其他重要新聞")}</span></div><a class="btn secondary link" href="${esc(n.url)}" target="_blank" rel="noopener" onclick="markSeen('${esc(n.id||'')}')">閱讀原文</a></div>`}).join("")}</div></div>`;

async function testConfigIntegrity(){
  try{
    const [sp,lg,ty]=await Promise.all([
      fetch('/config/sports.v1.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`sports HTTP ${r.status}`);return r.json()}),
      fetch('/config/leagues.v1.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`leagues HTTP ${r.status}`);return r.json()}),
      fetch('/config/content-types.v1.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`types HTTP ${r.status}`);return r.json()})
    ]);
    const localSports=SPORTS.slice();
    const localLeagues={...LEAGUES};
    const localTypes=TYPES.filter(x=>x!=='全部');
    const remoteSports=Array.isArray(sp)?sp:[];
    const remoteLeagues=lg&&typeof lg==='object'?lg:{};
    const remoteTypes=Array.isArray(ty)?ty:[];
    const sportMissing=localSports.filter(x=>!remoteSports.includes(x));
    const sportExtra=remoteSports.filter(x=>!localSports.includes(x));
    const leagueMismatch=Object.keys(localLeagues).some(k=>JSON.stringify(localLeagues[k].filter(x=>x!=='全部'))!==JSON.stringify((remoteLeagues[k]||[])));
    const typeMissing=localTypes.filter(x=>!remoteTypes.includes(x));

    if(sportMissing.length||sportExtra.length||leagueMismatch||typeMissing.length||typeExtra.length){
      return {name:'Config 完整性',status:'bad',detail:`設定不一致：sport ${sportMissing.length+sportExtra.length}、league ${leagueMismatch?'有差異':'一致'}、type ${typeMissing.length+typeExtra.length}`};

  }catch(e){

}

function autoTestBaselineDiff(results){
  try{
    const prev=JSON.parse(localStorage.getItem('sd_auto_test_baseline_v2')||'null');
    const current=Object.fromEntries(results.map(x=>[x.name,x.status]));
    if(!prev){
      localStorage.setItem('sd_auto_test_baseline_v2',JSON.stringify(current));
      return {name:'Regression Baseline',status:'ok',detail:'已建立第一份 baseline'};
    }
    const changed=[];
    const keys=new Set([...Object.keys(prev),...Object.keys(current)]);
    for(const k of keys)if(prev[k]!==current[k])changed.push(`${k}: ${prev[k]||'NEW'} → ${current[k]||'MISSING'}`);
    localStorage.setItem('sd_auto_test_baseline_v2',JSON.stringify(current));
    return changed.length?{name:'Regression Baseline',status:'warn',detail:`發現 ${changed.length} 個狀態變化：${changed.slice(0,3).join('；')}`}:{name:'Regression Baseline',status:'ok',detail:'與上次 baseline 一致'};
  }catch(e){
    return {name:'Regression Baseline',status:'warn',detail:'baseline 儲存失敗，但不影響功能測試'};
  }
}

async function runAutoTests(){
  if(autoTestState.running)return;
  const total=AUTO_TESTS.length+6;
  autoTestState={running:true,done:0,total,results:[]};
  status='自動測試開始：設定、API 合約、翻譯、健康度、PWA 與新聞分區…';
  render();

  const results=[];
  const prelim=[testConfigIntegrity(),testApiContract(),testTranslationService(),testHealthEndpoint(),testPwa()];
  const prelimResults=await Promise.allSettled(prelim);
  prelimResults.forEach((r,i)=>{
    const names=['Config 完整性','API Contract','標題翻譯服務','來源健康度','PWA'];
    results.push(r.status==='fulfilled'?r.value:{name:names[i],status:'bad',detail:String(r.reason?.message||r.reason)});
  });
  autoTestState.done=5;
  autoTestState.results=[...results];
  render();

  // Run news cases with limited concurrency. Results are displayed in fixed case order.
  const caseResults=new Array(AUTO_TESTS.length);
  let cursor=0;
  async function worker(){
    while(true){
      const i=cursor++; if(i>=AUTO_TESTS.length)return;
      const x=AUTO_TESTS[i];
      const section={id:`auto-test-${Date.now()}-${i}`,name:x.name,sport:x.sport,league:x.league,contentTypes:x.contentTypes,hours:x.hours};
      try{
        const d=await fetchNewsBatch([section],AUTO_TEST_TIMEOUT);
        const returned=Array.isArray(d.items)?d.items:[];
        const errors=Array.isArray(d.errors)?d.errors:[];
        const safe=normalizeSection(section);
        const own=returned.filter(n=>String(n.sectionId||'')===String(safe.id));
        const mapped=own.length?own:returned.filter(n=>String(n.sport||'')===safe.sport&&(safe.league==='全部'||String(n.league||'')===safe.league));
        const selected=(safe.contentTypes||[]).filter(t=>t!=='全部');
        const typed=selected.length?mapped.filter(n=>selected.some(t=>matchesType(n,t))):mapped;
        const wrongRoute=own.filter(n=>String(n.sport||'')!==safe.sport||(safe.league!=='全部'&&String(n.league||'')!==safe.league));
        let rowStatus='ok',detail=`${typed.length} 則符合；${errors.length?`來源異常 ${errors.length}`:'來源正常'}`;
        if(wrongRoute.length){rowStatus='bad';detail=`分區路由錯誤 ${wrongRoute.length} 則`}
        else if(selected.length&&mapped.length>0&&typed.length!==mapped.length){rowStatus='bad';detail=`內容類型過濾失效：${typed.length}/${mapped.length}`}
        else if(errors.length&&mapped.length===0){rowStatus='bad';detail=`API 回應但來源全部失敗：${errors.slice(0,2).join('；')}`}
        else if(mapped.length===0){rowStatus='warn';detail='API 正常但目前沒有符合條件新聞'}
        else if(errors.length){rowStatus='warn';detail=`${typed.length} 則符合；部分來源異常 ${errors.length}`}
        caseResults[i]={name:safe.name,status:rowStatus,detail};
      }catch(e){caseResults[i]={name:x.name,status:'bad',detail:String(e?.message||e)};}
      autoTestState.done=5+caseResults.filter(Boolean).length;
      autoTestState.results=[...results,...caseResults.filter(Boolean)];
      render();
    }
  }
  await Promise.all(Array.from({length:Math.min(4,AUTO_TESTS.length)},()=>worker()));
  results.push(...caseResults);
  const baseline=autoTestBaselineDiff(results);
  results.push(baseline);
  autoTestState.done=total;
  autoTestState.results=[...results];
  const bad=results.filter(x=>x.status==='bad').length;
  const warn=results.filter(x=>x.status==='warn').length;
  autoTestState.running=false;
  status=bad?`自動測試完成：${bad} 個失敗、${warn} 個警告`:`自動測試完成：${results.length-warn} 個通過、${warn} 個警告`;
  render();
}

async function translateBatch(texts){
  const unique=[...new Set(texts.filter(Boolean))];
  const now=Date.now();
  const missing=unique.filter(t=>{
    if(!titleNeedsTranslation(t)) return false;
    const hit=translationCache[t];
    return !hit || (hit.retryAfter && hit.retryAfter<=now);
  });
  if(missing.length){
    try{
      const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texts:missing}),cache:'no-store'});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);
      const out=Array.isArray(d.translations)?d.translations:[];
      missing.forEach((t,i)=>{
        const candidate=String(out[i]??'').trim();
        const bad=/invalid source language|example:\s*langpair|almost all languages supported|translation error|response error|quota|rate limit|\bhttp\s*\d{3}\b/i.test(candidate);
        if(candidate && !bad && candidate!==t){
          translationCache[t]={value:candidate,time:Date.now()};
        }else{
          translationCache[t]={value:t,time:Date.now(),retryAfter:Date.now()+2*60*1000};
        }
      });
      saveTranslationCache();
    }catch(_){
      missing.forEach(t=>{translationCache[t]={value:t,time:Date.now(),retryAfter:Date.now()+2*60*1000};});
    }
  }
  return Object.fromEntries(unique.map(t=>[t,translationCache[t]?.value||t]));
}

function decodeXmlText(s){
  return String(s||"")
    .replace(/<!\[CDATA\[|\]\]>/g,"")
    .replace(/<[^>]+>/g," ")
    .replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'")
    .replace(/\s+/g," ").trim();
}

function parseFallbackRss(xml,lang,section){
  const out=[];
  const items=String(xml||"").match(/<(?:item|entry)>[\s\S]*?<\/(?:item|entry)>/gi)||[];
  for(const item of items){
    const get=(tag)=>{
      const m=item.match(new RegExp(`<${tag}(?:[^>]*)>([\\s\\S]*?)<\\/${tag}>`,"i"));
      return m?decodeXmlText(m[1]):"";
    };
    const title=get("title");
    const url=get("link") || ((item.match(/<link[^>]+href=["']([^"']+)["']/i)||[])[1]||"");
    const source=get("source")||"新聞來源";
    const pub=get("pubDate")||get("published")||get("updated");
    if(!title||!url) continue;
    out.push({
      id:`fallback-${crypto.randomUUID()}`,
      sectionId:section.id,
      sport:section.sport,
      league:section.league,
      title,url,sourceName:source,
      publishedAt:Number.isFinite(Date.parse(pub))?new Date(pub).toISOString():new Date().toISOString(),
      language:lang,sourceCount:1,languages:[lang],relatedSources:[source],eventType:classify({title},section.contentTypes||[])
    });
  }
  return out;
}

async function browserFallbackForSection(section){
  // 僅在指定聯盟本次完全沒有資料時啟用，避免影響正常搜尋結果。
  if(section.league!=="NBA") return [];
  const feeds=[
    ["https://www.espn.com/espn/rss/nba/news","en"],
    ["https://www.cbssports.com/rss/headlines/nba/","en"]
  ];
  const results=[];
  for(const [feed,lang] of feeds){
    try{
      const proxies=[
        `https://api.allorigins.win/raw?url=${encodeURIComponent(feed)}`,
        `https://corsproxy.io/?url=${encodeURIComponent(feed)}`
      ];
      for(const proxy of proxies){
        try{
          const r=await fetch(proxy,{cache:"no-store"});
          if(!r.ok) continue;
          const xml=await r.text();
          const parsed=parseFallbackRss(xml,lang,section);
          if(parsed.length){ results.push(...parsed); break; }
        }catch(_){/* 換下一個備援代理 */}
      }
    }catch(_){/* 單一備援失敗不影響其他來源 */}
  }
  const uniq=new Map();
  for(const n of results){
    const k=String(n.url||n.title).replace(/\s+/g," ").trim();
    if(!uniq.has(k)) uniq.set(k,n);
  }
  return Array.from(uniq.values());
}

async function fetchNewsBatch(list,timeoutMs=API_TIMEOUT){

      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({sections:list.map(apiSection)}),
      signal:controller.signal,

    });
    const d=await r.json().catch(()=>({}));

    throw e;
  }finally{
    clearTimeout(timer);
  }
}

async function loadNews(force=false){
  if(!sections.length){status='請先建立日報分區';render();return;}
  status=force?'正在強制更新各國／各聯盟新聞…':'正在載入日報新聞…';
  render();

  const previous={...newsBySection};
  const cacheKey=JSON.stringify(sections.map(apiSection).sort((a,b)=>String(a.id).localeCompare(String(b.id))).map(x=>({sport:x.sport,league:x.league,contentTypes:x.contentTypes,hours:x.hours})));
  if(!force){
    try{
      const raw=JSON.parse(localStorage.getItem('sd_news_api_cache_v2')||'null');
      if(raw&&raw.key===cacheKey&&Date.now()-Number(raw.time||0)<NEWS_BROWSER_CACHE_TTL&&raw.data){
        const d=raw.data; const returned=Array.isArray(d.items)?d.items:[]; const next={};
        for(const s of sections){const safe=normalizeSection(s);const selected=(safe.contentTypes||[]).filter(x=>x!=='全部');next[safe.id]=returned.filter(n=>String(n.sport||'')===String(safe.sport||'')&&(safe.league==='全部'||String(n.league||'')===String(safe.league))&&(!selected.length||selected.some(t=>matchesType(n,t))));}
        newsBySection=next;lastUpdated=d.fetchedAt||lastUpdated;status=`使用 ${Math.round((Date.now()-raw.time)/1000)} 秒前的新聞快取`;render();return;
      }
    }catch(_){/* ignore bad cache */}
  }

  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),API_TIMEOUT);
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sections:sections.map(apiSection),forceRefresh:!!force}),signal:controller.signal,cache:'no-store'});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);
    const returned=Array.isArray(d.items)?d.items:[]; const next={};
    for(const s of sections){const safe=normalizeSection(s);const selected=(safe.contentTypes||[]).filter(x=>x!=='全部');next[safe.id]=returned.filter(n=>String(n.sport||'')===String(safe.sport||'')&&(safe.league==='全部'||String(n.league||'')===String(safe.league))&&(!selected.length||selected.some(t=>matchesType(n,t))));}
    newsBySection=next;lastUpdated=d.fetchedAt||new Date().toISOString();
    try{localStorage.setItem('sd_last_updated',lastUpdated);localStorage.setItem('sd_news_cache',JSON.stringify(newsBySection));localStorage.setItem('sd_news_api_cache_v2',JSON.stringify({key:cacheKey,time:Date.now(),data:d}));}catch(_){ }
    const total=Object.values(next).reduce((sum,v)=>sum+(Array.isArray(v)?v.length:0),0);
    const errorCount=Array.isArray(d.errors)?d.errors.length:0;
    status=total>0?`已更新 ${total} 則新聞｜${errorCount?`部分來源異常 ${errorCount}`:'多來源正常'}${d.cacheHits?.length&&!force?'｜伺服器快取':' '}`:(errorCount?`目前沒有符合條件的新聞｜部分來源異常 ${errorCount}`:'目前沒有符合條件的新聞｜搜尋服務暫時沒有回傳結果');
  }catch(e){
    newsBySection=previous;
    const cached=Object.values(previous).reduce((sum,v)=>sum+(Array.isArray(v)?v.length:0),0);
    status=cached>0?(navigator.onLine?`新聞來源暫時無法更新，保留上次 ${cached} 則新聞`:`離線資料：保留上次 ${cached} 則新聞，可能非最新`):'新聞來源暫時無法取得，請稍後再試';
  }finally{clearTimeout(timer);}
  render();
}


/* === 自動設備配置 ===
   依 viewport 寬度 + 觸控能力 + 裝置像素密度建立穩定的 device profile。
   不猜特定品牌／型號，避免不同 Android / iOS 機型被誤判。 */
function applyDeviceProfile(){
  const root=document.documentElement;
  const width=Math.max(1, Math.round(window.visualViewport?.width || window.innerWidth || root.clientWidth || 390));
  const height=Math.max(1, Math.round(window.visualViewport?.height || window.innerHeight || 800));
  const dpr=window.devicePixelRatio||1;
  const touch=Number(navigator.maxTouchPoints||0)>0 || 'ontouchstart' in window;
  let device='desktop';
  if(width<=399) device='phone-compact';
  else if(width<=699) device='phone';
  else if(width<=1023) device='tablet';
  root.dataset.device=device;
  root.dataset.input=touch?'touch':'pointer';
  root.dataset.orientation=width>height?'landscape':'portrait';
  root.dataset.dpr=dpr>=2?'high':'standard';
  root.style.setProperty('--device-width',width+'px');
  root.style.setProperty('--device-height',height+'px');
  root.style.setProperty('--safe-bottom','env(safe-area-inset-bottom, 0px)');
}
applyDeviceProfile();
window.addEventListener('resize',applyDeviceProfile,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(applyDeviceProfile,80),{passive:true});
if(window.visualViewport)window.visualViewport.addEventListener('resize',applyDeviceProfile,{passive:true});

document
  .querySelectorAll(".nav")
  .forEach(b=>{
    b.onclick=()=>go(b.dataset.page);
  });

try{
  const cached=JSON.parse(localStorage.getItem("sd_news_cache")||"null");
  if(cached&&typeof cached==="object")newsBySection=cached;
}catch(_e){}

window.addEventListener('offline',()=>{status='目前離線；顯示最後一次成功抓取的新聞資料';render();});
window.addEventListener('online',()=>{status='已恢復網路；可更新最新新聞';render();});
if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}

window.addEventListener("error",e=>{
  const el=document.getElementById("bootFallback");
  if(el && !document.getElementById("runtimeErrorCard")){
    el.id="runtimeErrorCard";
    el.innerHTML=`<h2>運動小日報</h2><div class="status err">頁面載入遇到問題，已避免白屏。請重新整理；若持續發生，請清除本站資料後再試。</div><button class="btn primary" onclick="location.reload()">重新整理</button>`;
  }
});
window.addEventListener("unhandledrejection",()=>{
  const el=document.getElementById("bootFallback");
  if(el && !document.getElementById("runtimeErrorCard")){
    el.id="runtimeErrorCard";
    el.innerHTML=`<h2>運動小日報</h2><div class="status err">載入程序發生例外，已避免白屏。請重新整理後再試。</div><button class="btn primary" onclick="location.reload()">重新整理</button>`;
  }
});
render();

loadNews();
loadHighlights(false);

</script>
