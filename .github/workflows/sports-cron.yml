name: 運動小日報新聞暖快取

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  warm-news-cache:
    runs-on: ubuntu-latest
    steps:
      - name: 呼叫 Vercel Cron API
        env:
          CRON_URL: https://yundong-xiaoribao.vercel.app/api/cron
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_URL"
